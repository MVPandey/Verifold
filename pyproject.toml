[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "verifold"
version = "0.1.0"
description = "An orchestrator that lets coding agents work as a research society."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "agent-client-protocol>=0.12.1,<0.13",
    "fastapi>=0.120,<1",
    "mcp>=2.3,<3",
    "pydantic>=2.12,<3",
    "sse-starlette>=3.6,<4",
    "uvicorn>=0.54,<1",
]

[project.scripts]
verifold = "verifold.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"verifold.runner" = ["LAB.md"]

[tool.ruff]
fix = true
line-length = 120
# The skill snapshots are kept exactly as imported, so Ruff leaves their code examples alone.
extend-exclude = [".agents"]

[tool.ruff.lint]
# UP keeps modern syntax, ANN requires annotations, and PERF flags hand-built loops that a comprehension replaces.
# B, SIM, RET, PIE, C4, and FURB catch likely bugs and needless code. ARG flags unused parameters, FBT positional
# flags, and ERA commented-out code.
extend-select = [
    "D", "RUF", "PT", "TID", "I", "PL", "UP", "ANN", "PERF",
    "B", "SIM", "RET", "PIE", "C4", "FURB", "PTH", "ARG", "FBT", "ERA",
]
ignore = ["D203", "D212"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Define a schema or a precise type instead of Any."

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = ["D", "PLR"]
# The post tool's parameters mirror PostRequest's fields, because harnesses fill a flat tool schema more reliably.
"src/verifold/server/join.py" = ["PLR0913"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.ty.environment]
# Tests import shared builders from tests/, the same path that pytest adds.
extra-paths = ["tests"]

[tool.ty.terminal]
output-format = "concise"

[tool.ty.rules]
unused-ignore-comment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--import-mode=importlib",
    "--cov=src/verifold",
    "--cov-report=term-missing",
    "--cov-fail-under=95",
    "--maxfail=3",
    "--durations=5",
]

[tool.coverage.run]
source = ["src/verifold"]

[dependency-groups]
dev = [
    "httpx2>=2.16,<3",
    "lefthook>=2.2.2,<3",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.2,<2",
    "pytest-cov>=7.1.0,<8",
    "pytest-mock>=3.17.0,<4",
    "ruff>=0.17.2,<1",
    "ty>=0.0.91,<1",
]
