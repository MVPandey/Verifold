name: CLI compatibility
on:
  push:
    branches: [main, staging]
  pull_request:
  merge_group:
  workflow_call:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.0.0', '22', '24.0.0', '24', '26.0.0', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:cli
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
      - name: Install npm compatible with every tested runtime
        run: npm install --global npm@10.9.2
      - name: Test the installed CLI on the selected runtime
        # Run directly so npm scripts cannot select the development Node binary.
        run: node scripts/package-check.mjs
