name: Publish to npm
on:
  push:
    tags:
      - 'v*'
permissions: {}
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify release tag and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { name, version, private: isPrivate } = JSON.parse(readFileSync('package.json', 'utf8'));
          const tag = process.env.RELEASE_TAG;
          if (name !== 'verifold' || isPrivate === true || !/^\d+\.\d+\.\d+$/.test(version) || tag !== `v${version}`) {
            throw new Error('Release tag must match the public verifold package version: vMAJOR.MINOR.PATCH.');
          }
          NODE
          git merge-base --is-ancestor HEAD origin/main
      - name: Install the supported npm CLI
        run: npm install --global npm@11.19.1
      - run: npm ci
      - run: make validate
      - run: npm run audit:security
      - name: Pack the validated release
        run: |
          mkdir release
          npm pack --pack-destination release
          cp .nvmrc release/node-version.txt
          cd release
          sha256sum verifold-*.tgz > SHA256SUMS
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: npm-release
          path: release/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: npm-release
          path: release
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: release/node-version.txt
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.19.1
      - name: Verify and publish the validated tarball
        shell: bash
        run: |
          cd release
          shopt -s nullglob
          packages=(verifold-*.tgz)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo 'Expected exactly one release tarball.' >&2
            exit 1
          fi
          sha256sum --check SHA256SUMS
          npm publish "./${packages[0]}" --access public --provenance
